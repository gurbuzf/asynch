[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "asynch"
version = "1.5.0"
description = "Python interface to ASYNCH, an asynchronous solver of hydrological models on river networks"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "GPL-2.0"}
dynamic = ["scripts", "dependencies"]   # setup.py: numpy; plus mpich and the `asynch` command in the self-contained wheel

keywords = ["hydrology", "river network", "ODE", "Runge-Kutta", "MPI"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: C",
    "Topic :: Scientific/Engineering :: Hydrology",
    "Operating System :: POSIX :: Linux",
]

[project.optional-dependencies]
h5 = ["h5py"]            # read .h5 outputs
fast = ["numba"]         # Model(..., jit="numba"): models written in Python at C speed
mpi = ["mpi4py"]         # pass an mpi4py communicator (mpirun works without it)
all = ["h5py", "numba", "mpi4py"]

[project.urls]
Documentation = "https://gurbuzf.github.io/asynch/"
Source = "https://github.com/gurbuzf/asynch"

[tool.setuptools]
packages = ["asynch"]
