[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "asynch"
version = "1.4.3"
description = "Python interface to ASYNCH, an asynchronous solver of hydrological models on river networks"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "GPL-2.0"}
dependencies = ["numpy"]

[project.optional-dependencies]
h5 = ["h5py"]
mpi = ["mpi4py"]

[project.scripts]
asynch-py = "asynch.__main__:main"

[tool.setuptools]
packages = ["asynch"]
