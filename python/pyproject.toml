[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "asynch-hlm"          # on PyPI ("asynch" is another project there); import asynch
version = "1.7.0"
description = "Python interface to ASYNCH, an asynchronous solver of hydrological models on river networks"
requires-python = ">=3.8"
license = {text = "GPL-2.0"}
dynamic = ["scripts", "dependencies", "readme"]   # setup.py: numpy; plus mpich and the `asynch` command in the
                                                 # self-contained wheel; readme = README.md + changelog summary

keywords = ["hydrology", "river network", "ODE", "Runge-Kutta", "MPI"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: C",
    "Topic :: Scientific/Engineering :: Hydrology",
    "Operating System :: POSIX :: Linux",
]

[project.optional-dependencies]
h5 = ["h5py"]            # read .h5 outputs
fast = ["numba"]         # Model(..., jit="numba"): models written in Python at C speed
mpi = ["mpi4py"]         # pass an mpi4py communicator (mpirun works without it)
all = ["h5py", "numba", "mpi4py"]

[project.urls]
Documentation = "https://gurbuzf.github.io/asynch/"
Source = "https://github.com/gurbuzf/asynch"
Changelog = "https://github.com/gurbuzf/asynch/blob/modernization/CHANGELOG.md"
"Release notes" = "https://gurbuzf.github.io/asynch/release_notes.html"

[tool.setuptools]
packages = ["asynch"]
