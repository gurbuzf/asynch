<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="900" height="480">
<!-- ASYNCH documentation diagram. Colours come from the site theme (docs/_static/custom.css); the second value of each var() is the light-theme fallback used when the file is viewed alone. -->
<style>
.d-frame{fill:var(--d-bg,#f7f9fc)}
.d-card{fill:var(--d-card,#fff);stroke:var(--d-line,#cdd6e1);stroke-width:1.5}
.d-t{font-family:var(--d-font,Inter,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif);font-size:14px;fill:var(--d-text,#17212f)}
.d-b{font-weight:700}
.d-s{font-size:12px;fill:var(--d-muted,#5b6b7f)}
.d-cap{font-size:11px;font-weight:700;letter-spacing:.08em;fill:var(--d-muted,#5b6b7f)}
.d-m{font-family:var(--d-mono,'JetBrains Mono',Menlo,Consolas,monospace)}
.d-ln{stroke:var(--d-line2,#7d8ca0);stroke-width:2;fill:none}
.d-lnl{stroke:var(--d-line,#cdd6e1);stroke-width:1.5;fill:none}
.d-dash{stroke-dasharray:6 5}
.d-acc{fill:var(--d-accent,#1f5fae)}.d-accs{fill:var(--d-accent-soft,#e3eefb)}
.d-accl{stroke:var(--d-accent,#1f5fae);fill:none;stroke-width:2}
.d-acct{fill:var(--d-accent,#1f5fae)}
.d-w{fill:var(--d-water,#2f7fd8)}.d-ws{fill:var(--d-water-soft,#cfe3f8)}
.d-wl{stroke:var(--d-water,#2f7fd8);fill:none;stroke-linecap:round}
.d-land{fill:var(--d-land,#dcebd0);stroke:var(--d-land-dark,#6fa35a);stroke-width:1.2}
.d-landl{stroke:var(--d-land-dark,#6fa35a);fill:none;stroke-width:2}
.d-landt{fill:var(--d-land-dark,#6fa35a)}
.d-soil{fill:var(--d-soil,#f1e4d0);stroke:var(--d-soil-dark,#b58b58);stroke-width:1.2}
.d-deep{fill:var(--d-deep,#e4d6c2);stroke:var(--d-soil-dark,#b58b58);stroke-width:1.2}
.d-soilt{fill:var(--d-soil-dark,#b58b58)}
.d-rainl{stroke:var(--d-rain,#5a9be6);stroke-width:2.2;stroke-linecap:round;fill:none}
.d-sun{fill:var(--d-sun,#e59a1c)}.d-sunl{stroke:var(--d-sun,#e59a1c);fill:none;stroke-width:2}
.d-ok{fill:var(--d-ok,#2e8540)}.d-okl{stroke:var(--d-ok,#2e8540);fill:none;stroke-width:2}
.d-bad{fill:var(--d-bad,#b42318)}
.d-p0{fill:var(--d-p0,#1f5fae)}.d-p1{fill:var(--d-p1,#0f8a7e)}.d-p2{fill:var(--d-p2,#c4461a)}.d-p3{fill:var(--d-p3,#8a4fbf)}
.d-p0l{stroke:var(--d-p0,#1f5fae)}.d-p1l{stroke:var(--d-p1,#0f8a7e)}.d-p2l{stroke:var(--d-p2,#c4461a)}
.d-inv{fill:var(--d-card,#fff)}
</style>
<rect class="d-frame" x="0" y="0" width="900" height="480" rx="12"/>
<defs>
  <marker id="m254-w" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto"><path class="d-w" d="M0 0L10 5L0 10z"/></marker>
  <marker id="m254-s" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto"><path class="d-sun" d="M0 0L10 5L0 10z"/></marker>
</defs>
<text class="d-t d-cap" x="150" y="100">HILLSLOPE</text>
<text class="d-t d-cap" x="620" y="140">CHANNEL</text>
<!-- rain -->
<g class="d-rainl"><path d="M220 26l-4 11M244 34l-4 11M292 26l-4 11M316 34l-4 11M268 22l-4 11"/></g>
<path class="d-wl" stroke-width="3" d="M265 50V104" marker-end="url(#m254-w)"/>
<text class="d-t d-b" x="278" y="74">rain p(t)</text><text class="d-t d-s" x="278" y="90">mm/h</text>
<!-- sun -->
<circle class="d-sun" cx="60" cy="52" r="13"/>
<g class="d-sunl" stroke-linecap="round"><path d="M60 30v-8M60 74v8M38 52h-8M82 52h8M44 36l-5-5M76 36l5-5M44 68l-5 5M76 68l5 5"/></g>
<text class="d-t d-s" x="60" y="104" text-anchor="middle">evaporation</text>
<!-- tanks -->
<rect class="d-ws" x="150" y="110" width="230" height="65" rx="10" stroke="var(--d-water,#2f7fd8)" stroke-width="1.5"/>
<text class="d-t d-b" x="166" y="137">Ponded water <tspan font-style="italic">s</tspan><tspan baseline-shift="sub" font-size="10">p</tspan></text>
<text class="d-t d-s" x="166" y="157">on the surface [m]</text>
<rect class="d-soil" x="150" y="230" width="230" height="80" rx="10"/>
<text class="d-t d-b" x="166" y="258">Top soil <tspan font-style="italic">s</tspan><tspan baseline-shift="sub" font-size="10">t</tspan></text>
<text class="d-t d-s" x="166" y="278">water in the top layer [m]</text>
<text class="d-t d-s" x="166" y="295">layer depth S<tspan baseline-shift="sub" font-size="9">L</tspan></text>
<rect class="d-deep" x="150" y="365" width="230" height="85" rx="10"/>
<text class="d-t d-b" x="166" y="393">Subsurface <tspan font-style="italic">s</tspan><tspan baseline-shift="sub" font-size="10">s</tspan></text>
<text class="d-t d-s" x="166" y="413">water below it [m]</text>
<text class="d-t d-s" x="166" y="430">depth h<tspan baseline-shift="sub" font-size="9">b</tspan> − S<tspan baseline-shift="sub" font-size="9">L</tspan></text>
<!-- evaporation from each storage -->
<g class="d-sunl"><path d="M150 142L108 122" marker-end="url(#m254-s)"/><path d="M150 270L108 250" marker-end="url(#m254-s)"/><path d="M150 407L108 387" marker-end="url(#m254-s)"/></g>
<text class="d-t d-b" x="100" y="120" text-anchor="end">e<tspan baseline-shift="sub" font-size="10">p</tspan></text>
<text class="d-t d-b" x="100" y="248" text-anchor="end">e<tspan baseline-shift="sub" font-size="10">t</tspan></text>
<text class="d-t d-b" x="100" y="385" text-anchor="end">e<tspan baseline-shift="sub" font-size="10">s</tspan></text>
<!-- vertical fluxes -->
<path class="d-wl" stroke-width="3" d="M265 177V224" marker-end="url(#m254-w)"/>
<text class="d-t d-b" x="278" y="198">q<tspan baseline-shift="sub" font-size="10">pt</tspan> <tspan class="d-s" font-weight="400">infiltration</tspan></text>
<text class="d-t d-s" x="278" y="214">faster when the soil is dry</text>
<path class="d-wl" stroke-width="3" d="M265 312V359" marker-end="url(#m254-w)"/>
<text class="d-t d-b" x="278" y="340">q<tspan baseline-shift="sub" font-size="10">ts</tspan> <tspan class="d-s" font-weight="400">percolation</tspan></text>
<!-- to the channel -->
<path class="d-wl" stroke-width="3" d="M380 142C500 142 500 200 612 200" marker-end="url(#m254-w)"/>
<text class="d-t d-b" x="430" y="132">q<tspan baseline-shift="sub" font-size="10">pc</tspan> <tspan class="d-s" font-weight="400">overland flow</tspan></text>
<path class="d-wl" stroke-width="3" d="M380 407C500 407 500 345 612 345" marker-end="url(#m254-w)"/>
<text class="d-t d-b" x="430" y="436">q<tspan baseline-shift="sub" font-size="10">sc</tspan> <tspan class="d-s" font-weight="400">subsurface flow</tspan></text>
<!-- channel -->
<rect class="d-ws" x="620" y="150" width="250" height="220" rx="12" stroke="var(--d-water,#2f7fd8)" stroke-width="1.5"/>
<path class="d-w" d="M620 318h250v40a12 12 0 0 1-12 12H632a12 12 0 0 1-12-12z" opacity=".9"/>
<text class="d-t d-b" x="745" y="236" text-anchor="middle" font-size="16">discharge q</text>
<text class="d-t d-s" x="745" y="256" text-anchor="middle">m³/s, a nonlinear reservoir</text>
<text class="d-t d-b d-inv" x="745" y="349" text-anchor="middle" font-size="13">of which baseflow q<tspan baseline-shift="sub" font-size="10">b</tspan></text>
<path class="d-wl" stroke-width="3" d="M745 72V146" marker-end="url(#m254-w)"/>
<text class="d-t d-b" x="732" y="96" font-size="13" text-anchor="end">from upstream links</text>
<text class="d-t d-s" x="732" y="112" text-anchor="end">Σ q of the parents</text>
<path class="d-wl" stroke-width="3" d="M745 372V446" marker-end="url(#m254-w)"/>
<text class="d-t d-b" x="758" y="414" font-size="13">to the child link</text>
</svg>
