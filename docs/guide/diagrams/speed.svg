<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 285" width="900" height="285">
<!-- ASYNCH documentation diagram. Colours come from the site theme (docs/_static/custom.css); the second value of each var() is the light-theme fallback used when the file is viewed alone. -->
<style>
.d-frame{fill:var(--d-bg,#f7f9fc)}
.d-card{fill:var(--d-card,#fff);stroke:var(--d-line,#cdd6e1);stroke-width:1.5}
.d-t{font-family:var(--d-font,Inter,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif);font-size:14px;fill:var(--d-text,#17212f)}
.d-b{font-weight:700}
.d-s{font-size:12px;fill:var(--d-muted,#5b6b7f)}
.d-cap{font-size:11px;font-weight:700;letter-spacing:.08em;fill:var(--d-muted,#5b6b7f)}
.d-m{font-family:var(--d-mono,'JetBrains Mono',Menlo,Consolas,monospace)}
.d-ln{stroke:var(--d-line2,#7d8ca0);stroke-width:2;fill:none}
.d-lnl{stroke:var(--d-line,#cdd6e1);stroke-width:1.5;fill:none}
.d-dash{stroke-dasharray:6 5}
.d-acc{fill:var(--d-accent,#1f5fae)}.d-accs{fill:var(--d-accent-soft,#e3eefb)}
.d-accl{stroke:var(--d-accent,#1f5fae);fill:none;stroke-width:2}
.d-acct{fill:var(--d-accent,#1f5fae)}
.d-w{fill:var(--d-water,#2f7fd8)}.d-ws{fill:var(--d-water-soft,#cfe3f8)}
.d-wl{stroke:var(--d-water,#2f7fd8);fill:none;stroke-linecap:round}
.d-land{fill:var(--d-land,#dcebd0);stroke:var(--d-land-dark,#6fa35a);stroke-width:1.2}
.d-landl{stroke:var(--d-land-dark,#6fa35a);fill:none;stroke-width:2}
.d-landt{fill:var(--d-land-dark,#6fa35a)}
.d-soil{fill:var(--d-soil,#f1e4d0);stroke:var(--d-soil-dark,#b58b58);stroke-width:1.2}
.d-deep{fill:var(--d-deep,#e4d6c2);stroke:var(--d-soil-dark,#b58b58);stroke-width:1.2}
.d-soilt{fill:var(--d-soil-dark,#b58b58)}
.d-rainl{stroke:var(--d-rain,#5a9be6);stroke-width:2.2;stroke-linecap:round;fill:none}
.d-sun{fill:var(--d-sun,#e59a1c)}.d-sunl{stroke:var(--d-sun,#e59a1c);fill:none;stroke-width:2}
.d-ok{fill:var(--d-ok,#2e8540)}.d-okl{stroke:var(--d-ok,#2e8540);fill:none;stroke-width:2}
.d-bad{fill:var(--d-bad,#b42318)}
.d-p0{fill:var(--d-p0,#1f5fae)}.d-p1{fill:var(--d-p1,#0f8a7e)}.d-p2{fill:var(--d-p2,#c4461a)}.d-p3{fill:var(--d-p3,#8a4fbf)}
.d-p0l{stroke:var(--d-p0,#1f5fae)}.d-p1l{stroke:var(--d-p1,#0f8a7e)}.d-p2l{stroke:var(--d-p2,#c4461a)}
.d-inv{fill:var(--d-card,#fff)}
</style>
<rect class="d-frame" x="0" y="0" width="900" height="285" rx="12"/>
<defs><marker id="sp-a" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto"><path fill="var(--d-line2,#7d8ca0)" d="M0 0L10 5L0 10z"/></marker></defs>
<path class="d-lnl" d="M316.1 26V226"/><text class="d-t d-s" x="316.1" y="244" text-anchor="middle">0.1 s</text>
<path class="d-lnl" d="M535.7 26V226"/><text class="d-t d-s" x="535.7" y="244" text-anchor="middle">1 s</text>
<path class="d-lnl" d="M755.2 26V226"/><text class="d-t d-s" x="755.2" y="244" text-anchor="middle">10 s</text>
<text class="d-t d-b" x="20" y="46" font-size="13">Built-in C model</text><text class="d-t d-s d-m" x="20" y="61" font-size="10.5">model number in the .gbl</text>
<path class="d-lnl" d="M250 48H860" stroke-dasharray="2 4"/>
<g><title>Built-in C model: 0.10 s</title><circle class="d-acc" cx="316.1" cy="48" r="8" stroke="var(--d-bg,#f7f9fc)" stroke-width="2"/></g>
<text class="d-t d-b" x="330.1" y="53" font-size="13">0.1 s</text>
<text class="d-t d-b" x="20" y="96" font-size="13">Your C code</text><text class="d-t d-s d-m" x="20" y="111" font-size="10.5">model.equations = "C code"</text>
<path class="d-lnl" d="M250 98H860" stroke-dasharray="2 4"/>
<g><title>Your C code: 0.10 s</title><circle class="d-acc" cx="316.1" cy="98" r="8" stroke="var(--d-bg,#f7f9fc)" stroke-width="2"/></g>
<text class="d-t d-b" x="330.1" y="103" font-size="13">0.1 s</text>
<text class="d-t d-b" x="20" y="146" font-size="13">Numba</text><text class="d-t d-s d-m" x="20" y="161" font-size="10.5">Model(..., jit="numba")</text>
<path class="d-lnl" d="M250 148H860" stroke-dasharray="2 4"/>
<g><title>Numba: 0.13 s</title><circle class="d-acc" cx="341.1" cy="148" r="8" stroke="var(--d-bg,#f7f9fc)" stroke-width="2"/></g>
<text class="d-t d-b" x="355.1" y="153" font-size="13">0.13 s</text>
<text class="d-t d-b" x="20" y="196" font-size="13">Plain Python</text><text class="d-t d-s d-m" x="20" y="211" font-size="10.5">model.equations = a_function</text>
<path class="d-lnl" d="M250 198H860" stroke-dasharray="2 4"/>
<g><title>Plain Python: 4.10 s</title><circle class="d-acc" cx="670.2" cy="198" r="8" stroke="var(--d-bg,#f7f9fc)" stroke-width="2"/></g>
<text class="d-t d-b" x="656.2" y="203" font-size="13" text-anchor="end">4.1 s</text>
<g><title>Plain Python before this release: 16 to 17.7 s</title><circle cx="805.3" cy="198" r="8" fill="none" stroke="var(--d-line2,#7d8ca0)" stroke-width="2"/></g>
<path class="d-ln" d="M793.3 198H682.2" marker-end="url(#sp-a)"/>
<text class="d-t d-s" x="805.3" y="182" text-anchor="middle">before: 16–17.7 s</text>
<text class="d-t d-s" x="250" y="262">faster ←</text>
<text class="d-t d-s" x="860" y="262" text-anchor="end">time for 5 000 links, 2 simulated hours, 1 process (log scale)</text>
</svg>
