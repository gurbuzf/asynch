<text class="d-t d-s" x="431" y="152" text-anchor="middle">the 7 states of model 254: the memory reserved for y</text>
<text class="d-t d-s d-b" x="791" y="160" text-anchor="middle" style="fill:var(--d-bad,#b42318)">not part of y:</text>
<text class="d-t d-s" x="791" y="175" text-anchor="middle">someone else's data</text>
<text class="d-t" x="450" y="212" text-anchor="middle" font-size="13">C does not check the index: <tspan class="d-m">states[7] = 0</tspan> silently overwrites the neighbouring memory (bug B-01).</text>
