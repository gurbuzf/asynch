<text class="d-t d-m" x="431" y="97" text-anchor="middle" font-size="13">s_s</text>
<text class="d-t d-m d-s" x="431" y="60" text-anchor="middle">y[3]</text>
<rect class="d-card" x="480" y="70" width="86" height="44" rx="6" stroke="var(--d-accent,#1f5fae)"/>
